# Hover profile for the PX4 SITL smoke test (see docs/MAVROS_SITL.md).
# Loaded into the comando_planner private namespace by scripts/apply_profile.sh.
ocp_type: hover
# open_loop: solve once from the current state and replay the whole plan —
# no re-solves on the way to the staging point, so no handoff-recovery churn.
# PX4's position controller tracks the replayed setpoints. Use mpc only if
# the start point must react to disturbances mid-transit.
mode: open_loop
n_replay: 4
hover_target_x: 2.0
hover_target_y: 2.0
# World 1.8 m start; the SITL platform sits at ~0.2 m, so this is 1.6 m
# target-relative — above the stc_landing staging floor and LOS trigger
# (both default to 1.3 m relative = world 1.5 m).
hover_target_z: 1.8
# Params are sticky on the rosparam server: always state land_action
# explicitly so a previous landing profile can't leak it into hover.
land_action: none
