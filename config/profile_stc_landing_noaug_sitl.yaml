# stc_landing_noaug profile (ROS2 param-file format for `ros2 param load` /
# scripts/apply_profile.sh). NOTE: unlike the ROS1 branch, `land_action` is not
# a declared parameter on this node yet (no touchdown disarm) — do not add it
# here or the load fails. Trigger via ocp_launch.py or apply_profile.sh.
# Scenario tuning (SZMUK_Z_STAGE / SZMUK_LOS_ALT_TRIG = 1.3) is injected by
# planner_launch.py, not by this profile.
# n_replay MUST be 4, not the descriptor's NEX=7. The warm start is shifted
# n_replay nodes (~0.12 s each) but x0 is only predicted solve_lead (~0.3 s)
# ahead: at 7 the shift is 0.84 s against a 0.26 s lead, so x0 is ~0.6 s out of
# sync with its own warm start -> initial defect blows up (constraint ~5e5) and
# the solver bails at 27 iters. At 4 (0.48 s shift vs 0.30 s lead) it converges:
# 17/17 accepted, lateral error 3.79 -> 0.04 m. The validated MAVROS run hit 4
# by rosparam stickiness from profile_hover_sitl.yaml, never explicitly.
/comando_planner:
  ros__parameters:
    ocp_type: stc_landing_noaug
    mode: mpc
    n_replay: 4
